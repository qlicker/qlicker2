services:
  mongo:
    image: mongo:7
    command: ["mongod", "--port", "${MONGO_PORT:?Set MONGO_PORT in .env}", "--wiredTigerCacheSizeGB", "${MONGO_WIREDTIGER_CACHE_SIZE_GB:-0.25}"]
    ports:
      - "${MONGO_PORT:?Set MONGO_PORT in .env}:${MONGO_PORT:?Set MONGO_PORT in .env}"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}"]
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    restart: unless-stopped

  server:
    build:
      context: ./server
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    ports:
      - "${API_PORT:?Set API_PORT in .env}:${API_PORT:?Set API_PORT in .env}"
    environment:
      - PORT=${API_PORT:?Set API_PORT in .env}
      - MONGO_URI=mongodb://mongo:${MONGO_PORT:?Set MONGO_PORT in .env}/qlicker
      - MONGO_MAX_POOL_SIZE=${MONGO_MAX_POOL_SIZE:-25}
      - MONGO_MIN_POOL_SIZE=${MONGO_MIN_POOL_SIZE:-0}
      - MONGO_SERVER_SELECTION_TIMEOUT_MS=${MONGO_SERVER_SELECTION_TIMEOUT_MS:-10000}
      - MONGO_SOCKET_TIMEOUT_MS=${MONGO_SOCKET_TIMEOUT_MS:-45000}
      - MONGO_CONNECT_RETRIES=${MONGO_CONNECT_RETRIES:-6}
      - MONGO_CONNECT_RETRY_DELAY_MS=${MONGO_CONNECT_RETRY_DELAY_MS:-2000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ANONYMOUS_SESSION_SECRET=${ANONYMOUS_SESSION_SECRET:-}
      - ROOT_URL=${ROOT_URL:-http://localhost:3000}
      - MAIL_URL=${MAIL_URL:-}
      - NODE_ENV=${NODE_ENV:-production}
      # The development stack proxies API traffic over Docker's private bridge.
      - TRUST_PROXY=${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      - APP_VERSION=${APP_VERSION:-latest}
      - DISABLE_RATE_LIMITS=${DISABLE_RATE_LIMITS:-false}
      - AI_BACKEND_ALLOW_PRIVATE_HOSTS=${AI_BACKEND_ALLOW_PRIVATE_HOSTS:-true}
      - AI_BACKEND_ALLOWED_PRIVATE_HOSTS=${AI_BACKEND_ALLOWED_PRIVATE_HOSTS:-localhost,127.0.0.1,::1,host.docker.internal}
      - AI_BACKEND_REQUEST_TIMEOUT_MS=${AI_BACKEND_REQUEST_TIMEOUT_MS:-300000}
      - REDIS_URL=redis://redis:${REDIS_PORT:-6379}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  # One Linux-host collector per deployment, independent of API replicas.
  system-monitor:
    build:
      context: ./server
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    command: ["node", "--max-old-space-size=64", "src/systemMonitor.js"]
    environment:
      - MONGO_URI=mongodb://mongo:${MONGO_PORT:?Set MONGO_PORT in .env}/qlicker
      - REDIS_URL=redis://redis:${REDIS_PORT:-6379}
      - SYSTEM_MONITOR_PROC_PATH=/host/proc
      - SYSTEM_MONITOR_COLLECTOR_ID=host
      - SYSTEM_MONITOR_SAMPLE_INTERVAL_SECONDS=${SYSTEM_MONITOR_SAMPLE_INTERVAL_SECONDS:-60}
      - SYSTEM_MONITOR_ACTIVE_WINDOW_MINUTES=${SYSTEM_MONITOR_ACTIVE_WINDOW_MINUTES:-15}
      - SYSTEM_MONITOR_NETWORK_INTERFACES=${SYSTEM_MONITOR_NETWORK_INTERFACES:-}
    volumes:
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      # PID 1 selects the host network namespace; /proc/net follows the reader.
      - /proc/1/net/dev:/host/proc/net/dev:ro
      - /proc/1/net/route:/host/proc/net/route:ro
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:80"
    environment:
      - API_PORT=${API_PORT:?Set API_PORT in .env}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
